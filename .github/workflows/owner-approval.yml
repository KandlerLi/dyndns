name: Owner approval

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  issue_comment:
    types:
      - created

permissions: {}

jobs:
  reset:
    name: Reset approval
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require approval for this commit
        run: |
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${PR_SHA}" \
            -f state=pending \
            -f context='Owner approval' \
            -f description='Waiting for KandlerLi to comment /approve on the PR'

  approve:
    name: Record approval
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'KandlerLi' &&
      github.event.comment.body == '/approve'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Approve the current PR commit
        run: |
          pr_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${pr_sha}" \
            -f state=success \
            -f context='Owner approval' \
            -f description='Approved by KandlerLi'
