name: Apply

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: dyndns-terraform
  cancel-in-progress: false

jobs:
  terraform:
    uses: KandlerLi/gha-common/.github/workflows/terraform-apply.yml@v0.0.7
    with:
      aws_region: eu-central-1
      extra_repo_vars: "ROUTE53_ZONE_ID"
      extra_validate_command: "python3 -m unittest discover -s tests -v"
    secrets: inherit
