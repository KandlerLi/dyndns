name: Security scan

# Separate from apply.yml so a finding can never block an apply.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trivy-config:
    uses: KandlerLi/gha-common/.github/workflows/trivy-config.yml@v0.0.9
    # Needs no AWS or cluster access, so it stays off the self-hosted runner.
    with:
      runs_on: '["ubuntu-latest"]'
    permissions:
      contents: read

  gitleaks:
    uses: KandlerLi/gha-common/.github/workflows/gitleaks.yml@v0.0.12
    permissions:
      contents: read
