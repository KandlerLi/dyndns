name: Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  terraform:
    uses: KandlerLi/gha-common/.github/workflows/terraform-checks.yml@v0.0.14
    with:
      aws_region: eu-central-1
      extra_validate_command: "python3 -m unittest discover -s tests -v"
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: write
