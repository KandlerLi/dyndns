name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    name: Build CI image
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}"
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build CI image
        run: docker build -t ghcr.io/kandlerli/dyndns-ci:latest .github/ci

      - name: Push CI image
        run: docker push ghcr.io/kandlerli/dyndns-ci:latest

  validate:
    name: Validate
    needs: build-image
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/kandlerli/dyndns-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --network host

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without the remote backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Run Lambda unit tests
        run: python3 -m unittest discover -s tests -v

  plan:
    name: Terraform plan
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [build-image, validate]
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 15
    container:
      image: ghcr.io/kandlerli/dyndns-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --network host
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      AWS_REGION: eu-central-1
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify plan configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
          ROUTE53_ZONE_ID: ${{ vars.ROUTE53_ZONE_ID }}
        run: |
          if [[ -z "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::Missing repository variable AWS_ACCOUNT_ID"
            exit 1
          fi
          if [[ -z "$AWS_PLAN_ROLE_ARN" ]]; then
            echo "::error::Missing repository variable AWS_PLAN_ROLE_ARN"
            exit 1
          fi
          if [[ -z "$ROUTE53_ZONE_ID" ]]; then
            echo "::error::Missing repository variable ROUTE53_ZONE_ID"
            exit 1
          fi

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: GitHubPlan-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Create speculative plan
        run: terraform plan -input=false -lock=false -no-color
